<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123a6d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Master Poll Worker Guide</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <img class="header-logo" src="icons/icon-192.png" alt="" width="52" height="52" aria-hidden="true" />
        <div class="topbar-text">
          <p class="eyebrow">Poll Worker Training Tool</p>
          <h1 id="sectionTitle">Master Poll Worker Guide</h1>
        </div>
      </div>
      <button id="menuButton" class="icon-button" aria-label="Open menu">&#9776;</button>
    </header>

    <section class="mode-strip" aria-label="Election mode">
      <button class="mode-button active" data-mode="early">Early Voting</button>
      <button class="mode-button" data-mode="election">Election Day</button>
    </section>

    <main id="mainContent" tabindex="-1"></main>
    <div id="appStatus" class="sr-only" role="status" aria-live="polite"></div>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-button"><span aria-hidden="true">&#8962;</span><small>Home</small></button>
      <button data-route="procedures" class="nav-button active"><span aria-hidden="true">&#9745;</span><small>Checklist</small></button>
      <button data-route="lookup" class="nav-button"><span aria-hidden="true">&#8981;</span><small>Lookup</small></button>
      <button data-route="progress" class="nav-button"><span aria-hidden="true">&#9733;</span><small>Progress</small></button>
      <button data-route="report" class="nav-button"><span aria-hidden="true">&#9636;</span><small>Summary</small></button>
    </nav>
  </div>

  <dialog id="sideMenu" class="side-menu">
    <div class="menu-header">
      <h2>More</h2>
      <button id="closeMenu" class="icon-button" aria-label="Close menu">&times;</button>
    </div>
    <button data-route="dosdonts">Procedure Reminders</button>
    <button data-route="board">Board Questions</button>
    <button data-route="current">Current Information</button>
    <button data-route="settings">Settings & Backup</button>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
