<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123a6d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Poll worker training and field reference tool">
  <title>Master Poll Worker Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles-clean.css?v=1.0.3">
  <link rel="stylesheet" href="procedures-grid.css?v=1.0.3">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-copy">
        <p class="eyebrow">Poll Worker Training Tool</p>
        <h1 id="sectionTitle">Master Poll Worker Guide</h1>
      </div>
      <button id="menuButton" class="icon-button" aria-label="Open menu">☰</button>
    </header>

    <section class="mode-strip" aria-label="Election mode">
      <button class="mode-button active" data-mode="early">Early Voting</button>
      <button class="mode-button" data-mode="election">Election Day</button>
    </section>

    <main id="mainContent" tabindex="-1"></main>

    <button id="backToTop" class="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-button active"><span>⌂</span><small>Home</small></button>
      <button data-route="guide" class="nav-button"><span>☑</span><small>Guide</small></button>
      <button data-route="procedures" class="nav-button"><span>!</span><small>Procedures</small></button>
      <button data-route="routines" class="nav-button"><span>⇅</span><small>Open/Close</small></button>
      <button data-route="training" class="nav-button"><span>★</span><small>Training</small></button>
    </nav>
  </div>

  <dialog id="sideMenu" class="side-menu">
    <div class="menu-header"><h2>More</h2><button id="closeMenu" class="icon-button" aria-label="Close menu">×</button></div>
    <button data-open-search><strong>⌕ Search</strong><span>Search the whole guide</span></button>
    <button data-route="mpw"><strong>Master Poll Worker</strong><span>First-round checks and Today’s Briefing</span></button>
    <button data-route="references"><strong>Reference Library</strong><span>Accessibility, challengers, media, rules</span></button>
    <button data-route="board"><strong>Questions for Board</strong><span>Items to verify</span></button>
    <button data-route="report"><strong>Daily Report</strong><span>Review today and carry forward</span></button>
    <button data-route="endnight" class="election-only"><strong>End-of-Night Checklist</strong><span>Election Day packing destinations</span></button>
    <button data-route="settings"><strong>Settings & Backup</strong><span>Local data and version</span></button>
  </dialog>

  <dialog id="searchDialog" class="search-dialog">
    <div class="search-head"><input id="globalSearch" class="search-input" autocomplete="off" placeholder="Search affirm, provisional, router, spoil…"><button id="closeSearch" class="icon-button" aria-label="Close search">×</button></div>
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <script src="core.js?v=1.0.1-clean"></script>
  <script src="content.js?v=20260817b"></script>
  <script src="modules.js?v=1.0.3-clean"></script>
  <script src="app-clean.js?v=1.0.3"></script>
</body>
</html>
